esphome:
  name: smalltv
  friendly_name: SmallTV
  libraries:
    - SPI

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
    
ota:
  - platform: esphome
    
external_components:
  - source:
      type: local
      path: components
    components: [ smalltv ]

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 20
  - file: "gfonts://Roboto"
    id: font_label
    size: 14
  - file: "gfonts://Roboto@700"
    id: font_value_large
    size: 42
  - file: "gfonts://Roboto@700"
    id: font_value_medium
    size: 26

text_sensor:
  - platform: homeassistant
    id: ups_status
    entity_id: sensor.eaton_ellipse_pro_status

sensor:
  - platform: homeassistant
    id: ups_battery_charge
    entity_id: sensor.eaton_ellipse_pro_battery_charge

  - platform: homeassistant
    id: ups_real_power
    entity_id: sensor.eaton_ellipse_pro_real_power

  - platform: homeassistant
    id: ups_load
    entity_id: sensor.eaton_ellipse_pro_load

  - platform: homeassistant
    id: ups_output_voltage
    entity_id: sensor.eaton_ellipse_pro_output_voltage

  - platform: homeassistant
    id: ups_runtime
    entity_id: sensor.eaton_ellipse_pro_battery_runtime_minutes

display:
  - platform: smalltv
    id: tft_display
    update_interval: 5s
    lambda: |-
      // Each 16px band is cleared to black by the component before this
      // runs, so no explicit background fill is needed except the header.
 
      // --- Header bar ---
      it.filled_rectangle(0, 0, 240, 40, Color(35, 110, 220));
      it.printf(12, 10, id(font_header), Color(255, 255, 255), "UPS: %s", id(ups_status).state.c_str());
 
      // --- Power (big number) ---
      it.print(12, 46, id(font_label), Color(190, 195, 205), "Power");
      it.printf(12, 64, id(font_value_large), Color(225, 225, 40), "%.0f W", id(ups_real_power).state);
 
      it.line(8, 118, 232, 118, Color(60, 70, 90));
 
      // --- Load / Voltage row ---
      it.print(12, 124, id(font_label), Color(190, 195, 205), "Load");
      it.printf(12, 142, id(font_value_medium), Color(255, 140, 0), "%.0f%%", id(ups_load).state);
 
      it.print(128, 124, id(font_label), Color(190, 195, 205), "Voltage");
      it.printf(128, 142, id(font_value_medium), Color(90, 180, 255), "%.1fV", id(ups_output_voltage).state);
 
      it.line(120, 118, 120, 236, Color(60, 70, 90));
      it.line(8, 178, 232, 178, Color(60, 70, 90));
 
      // --- Battery / Runtime row ---
      it.print(12, 184, id(font_label), Color(190, 195, 205), "Battery");
      it.printf(12, 202, id(font_value_medium), Color(70, 220, 70), "%.0f%%", id(ups_battery_charge).state);
 
      it.print(128, 184, id(font_label), Color(190, 195, 205), "Runtime");
      it.printf(128, 202, id(font_value_medium), Color(255, 255, 255), "%.0f min", id(ups_runtime).state);
